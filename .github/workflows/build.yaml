name: Build with debian
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ${{ matrix.os }}
    container:
      image: debian:13
      env:
        LANG: C.UTF-8
    strategy:
      matrix:
        include:
          - os: "ubuntu-24.04"
          - os: "ubuntu-24.04-arm"
    steps:
      - name: Test
        run: |
          curl -Ls https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb | sudo dpkg -i
          google-chrome --headless --disable-gpu --dump-dom --no-sandbox "https://api.cloudflare.com/cdn-cgi/trace"

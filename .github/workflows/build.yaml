name: Build with debian
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: "ubuntu-24.04"
          - os: "ubuntu-24.04-arm"
    steps:
      - name: Test
        run: |
          #apt-get update
          #apt-get install -y curl
          curl -Ls https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          #dpkg -i ./google-chrome-stable_current_amd64.deb
          google-chrome --headless --disable-gpu --dump-dom --no-sandbox "https://api.cloudflare.com/cdn-cgi/trace"
